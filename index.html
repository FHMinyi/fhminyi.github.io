<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/index.css">
    <title>郑丯玲的空间</title>
</head>

<body>
    <form action="" class="input">
        <div>
            <span>邮箱：</span>
            <input type="email" name="email" id="">
        </div>
        <div>
            <span>密码：</span>
            <input type="password" name="password" id="">
        </div>
        <div>
            <span>电话：</span>
            <input type="tel" name="phone" id="">
        </div>
        <div>
            <span>范围选择器</span>
            <input type="range" name="range" id="" value="22" max="50" min="-3">
        </div>
        <div>
            <span>颜色选择器</span>
            <input type="color" name="color" id="">
        </div>
        <div class="date">
            <div>
                <span>日期：</span>
                <input type="date" name="date" id="">
            </div>
            <div>
                <span>月份：</span>
                <input type="month" name="month" id="">
            </div>
            <div>
                <span>周：</span>
                <input type="week" name="week" id="">
            </div>
            <div>
                <span>时间：</span>
                <input type="time" name="time" id="">
            </div>
            <div>
                <span>日期时间：</span>
                <input type="datetime-local" name="datetime" id="">
            </div>
        </div>
        <input type="submit">
    </form>
    <hr>
    <video src="./res/小电影.mp4" muted controls poster="./res/封面.png" preload="auto">11</video>
    <hr>
    <audio src="./res/梦.mp3" controls autoplay></audio>
    <hr>
    <a href="./html/css-flex练习.html" class="css-flex练习">css-flex练习</a>
</body>

</html>
